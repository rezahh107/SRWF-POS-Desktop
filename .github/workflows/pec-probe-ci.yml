name: PEC Probe CI

on:
  pull_request:
  push:
    branches:
      - feat/pec-probe-poc

permissions:
  contents: read

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Core tests
        run: dotnet restore tests/SRWF.POS.PecProbe.Tests/SRWF.POS.PecProbe.Tests.csproj
      - name: Build Core tests
        run: dotnet build tests/SRWF.POS.PecProbe.Tests/SRWF.POS.PecProbe.Tests.csproj -c Release --no-restore
      - name: Test Core
        run: dotnet test tests/SRWF.POS.PecProbe.Tests/SRWF.POS.PecProbe.Tests.csproj -c Release --no-build

  windows-build-publish:
    name: Windows build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Publish win-x64
        run: dotnet publish src/SRWF.POS.PecProbe.App -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "artifacts/win-x64/SRWF-POS-PEC-Probe.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable missing: $exe" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTimeUtc
      - uses: actions/upload-artifact@v4
        with:
          name: SRWF-POS-PEC-Probe-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
